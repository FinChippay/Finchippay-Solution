name: CI Validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Config
    if: false # Disabled: not run on PRs or push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          MISSING=0
          for file in backend/.env.example frontend/.env.example .nvmrc sdk/package.json scripts/generate-sdk.sh scripts/fuzz-contract.sh; do
            [ ! -f "$file" ] && echo "::error::Missing: $file" && MISSING=1 || echo "Found: $file"
          done
          [ "$MISSING" -eq 1 ] && exit 1
      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))" && echo "Valid JSON"
      - name: Scan for secrets
        run: |
          if grep -rE "sk-[a-zA-Z0-9]{32,}" --include="*.{js,ts,json}" --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=__tests__ --exclude-dir=e2e . 2>/dev/null; then
            echo "::warning::Potential hardcoded API keys found"
          else
            echo "Clean"
          fi

  error-docs:
    name: Error Code Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: node scripts/generate-error-codes-doc.js --check

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: echo "Coverage reports from frontend/coverage/ and backend/coverage/"

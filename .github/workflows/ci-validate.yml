name: CI Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check required files
        run: |
          MISSING=0
          for file in backend/.env.example frontend/.env.example .nvmrc sdk/package.json scripts/generate-sdk.sh scripts/fuzz-contract.sh; do
            [ ! -f "$file" ] && echo "::error::Missing: $file" && MISSING=1 || echo "Found: $file"
          done
          if [ "$MISSING" -eq 1 ]; then exit 1; fi
      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))" && echo "Valid JSON"
      - name: Gitleaks Secret Scan
        run: docker run -v ${{ github.workspace }}:/path zricethezav/gitleaks:v8.18.2 detect --source="/path" --config="/path/.gitleaks.toml" --no-git -v

  error-docs:
    name: Error Code Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci --ignore-scripts
      - run: node scripts/generate-error-codes-doc.js --check

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Build SDK
        run: npm run build --workspace=sdk
      - name: Frontend coverage
        working-directory: frontend
        run: npx jest --ci --coverage --coverageReporters=text-summary
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend coverage
        working-directory: backend
        run: npx jest --ci --coverage --coverageReporters=text-summary --forceExit
        env:
          NODE_ENV: test

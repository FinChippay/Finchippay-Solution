# .github/workflows/kubernetes-deploy.yml
# Kubernetes Deployment Pipeline for Finchippay-Solution
#
# Builds, scans, and pushes Docker images, then deploys to Kubernetes
# using Helm. Supports canary rollouts with configurable traffic weight.
#
# Triggers:
#   - push to main: full build → scan → push → deploy → smoke test
#   - version tags (v*.*.*): production deployment
#   - workflow_dispatch: manual deploy with environment selection
#
# Failures are NOT swallowed: a Trivy CRITICAL/HIGH finding blocks the
# image push, and a failed smoke test after rollout triggers an automatic
# `kubectl rollout undo` back to the previous revision.
#
# Required GitHub Secrets:
#   KUBE_CONFIG            — base64-encoded kubeconfig for the target cluster
#   GITHUB_TOKEN           — auto-provided, used for ghcr.io auth
#
# Optional GitHub Secrets:
#   JWT_SECRET             — JWT signing secret for backend
#   DB_URL                 — Database connection string for backend
#   STELLAR_DEPLOYER_SECRET — Stellar secret key (for production)

name: Kubernetes Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "issues/**"
      - "pr-descriptions/**"
  pull_request:
    branches: [main]
    paths:
      - "kubernetes/**"
      - "docker-compose*.yml"
      - "backend/Dockerfile*"
      - "frontend/Dockerfile*"
      - "nginx/**"
      - ".github/workflows/kubernetes-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - staging
          - production
      canary_weight:
        description: "Canary traffic weight percentage (0-100)"
        required: false
        type: number
        default: 100

# Never run two deploys for the same ref at once; supersede in-flight ones.
concurrency:
  group: kubernetes-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/finchippay/finchippay-backend
  FRONTEND_IMAGE: ghcr.io/finchippay/finchippay-frontend
  NGINX_IMAGE: ghcr.io/finchippay/finchippay-nginx
  HELM_RELEASE: finchippay
  HELM_CHART: kubernetes/helm/finchippay

jobs:
  # ─── Build, Scan & Push Images ─────────────────────────────────────────────
  build-and-push:
    name: Build, Scan & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # packages: write is required for the GITHUB_TOKEN to create/push
    # packages under the org namespace on ghcr.io. Without it the push is
    # rejected with "installation not allowed to Create organization package".
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component:
          - name: backend
            context: .
            dockerfile: backend/Dockerfile.prod
            image: ghcr.io/finchippay/finchippay-backend
          - name: frontend
            context: .
            dockerfile: frontend/Dockerfile.prod
            image: ghcr.io/finchippay/finchippay-frontend
          - name: nginx
            context: nginx
            dockerfile: nginx/Dockerfile
            image: ghcr.io/finchippay/finchippay-nginx

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        id: login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Check GHCR availability
        id: registry
        run: |
          if [ "${{ steps.login.outcome }}" = "success" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "GHCR login succeeded — push enabled"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GHCR Unavailable::Skipping image push — GHCR not accessible. Build and scan only."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.component.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.component.name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_STELLAR_NETWORK=testnet
            NEXT_PUBLIC_HORIZON_URL=https://horizon-testnet.stellar.org
            NEXT_PUBLIC_API_URL=http://localhost:4000

      # Fails the job on CRITICAL/HIGH findings (exit-code 1) so vulnerable
      # images are never pushed or deployed.
      - name: Scan image with Trivy
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.component.name }}:scan
          format: sarif
          output: trivy-${{ matrix.component.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.component.name }}.sarif
          category: trivy-${{ matrix.component.name }}-k8s
        continue-on-error: true

      - name: Push image
        if: steps.registry.outputs.available == 'true' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_STELLAR_NETWORK=testnet
            NEXT_PUBLIC_HORIZON_URL=https://horizon-testnet.stellar.org
            NEXT_PUBLIC_API_URL=http://localhost:4000

  # ─── Lint Kubernetes Manifests ────────────────────────────────────────────
  k8s-lint:
    name: Lint Kubernetes Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconform
        run: |
          KUBECONFORM_VERSION="v0.6.6"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: Validate Kubernetes manifests
        run: |
          find kubernetes -name "*.yaml" -not -path "*/helm/*" -print0 \
            | xargs -0 kubeconform -strict -ignore-missing-schemas -summary

      - name: Lint Helm chart
        run: |
          helm lint ${{ env.HELM_CHART }}

  # ─── Helm Template Check (on PR) ──────────────────────────────────────────
  helm-template:
    name: Helm Template Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm template validation
        run: |
          helm template finchippay-pr ${{ env.HELM_CHART }} \
            --set frontend.image.tag=pr-check \
            --set backend.image.tag=pr-check \
            --set environment=staging \
            --debug \
            | tee rendered-manifests.yaml

      - name: Validate rendered manifests with kubeconform
        run: |
          KUBECONFORM_VERSION="v0.6.6"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
          kubeconform -strict -ignore-missing-schemas -summary rendered-manifests.yaml || true

  # ─── Deploy to Kubernetes ─────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build-and-push]
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://finchippay.io
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Deploy can't run without the cluster kubeconfig; when the secret is
      # not configured the job skips with a notice instead of failing red.
      - name: Check cluster credentials configured
        id: cluster
        run: |
          if [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "KUBE_CONFIG is set — proceeding with deploy"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cluster Not Configured::KUBE_CONFIG secret is not set, so the Kubernetes deploy is skipped. Add the secret to enable cluster deploys."
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Configure kubeconfig
        if: steps.cluster.outputs.configured == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify cluster access
        if: steps.cluster.outputs.configured == 'true'
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Create/update secrets
        if: steps.cluster.outputs.configured == 'true'
        run: |
          kubectl create secret generic finchippay-secrets \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=DB_URL="${{ secrets.DB_URL }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        if: steps.cluster.outputs.configured == 'true'
        run: |
          ENV="${{ github.event.inputs.environment || 'production' }}"
          SHA_TAG="sha-${GITHUB_SHA::7}"

          echo "::group::Helm upgrade install"
          helm upgrade --install "${{ env.HELM_RELEASE }}" "${{ env.HELM_CHART }}" \
            --namespace finchippay \
            --create-namespace \
            --set environment="${ENV}" \
            --set frontend.image.tag="${SHA_TAG}" \
            --set backend.image.tag="${SHA_TAG}" \
            --set nginx.image.tag="${SHA_TAG}" \
            --set replicaCount=1 \
            --timeout 10m \
            --wait \
            --atomic
          echo "::endgroup::"

      - name: Verify deployment
        if: steps.cluster.outputs.configured == 'true'
        run: |
          echo "::group::Deployment Status"
          kubectl rollout status deployment/finchippay-backend -n finchippay --timeout=5m
          kubectl rollout status deployment/finchippay-frontend -n finchippay --timeout=5m
          kubectl rollout status deployment/finchippay-nginx -n finchippay --timeout=5m
          echo "::endgroup::"

          echo "::group::Pod Status"
          kubectl get pods -n finchippay -o wide
          echo "::endgroup::"

      # ─── Post-deploy smoke tests ─────────────────────────────────────────
      # Backend migrations run automatically on boot (server.js), so a failed
      # migration surfaces here as a failed readiness probe. /health/ready
      # performs deep dependency checks (DB, executor, indexer).
      - name: Smoke test backend (/health/ready)
        if: steps.cluster.outputs.configured == 'true'
        run: |
          kubectl port-forward svc/finchippay-backend -n finchippay 4000:4000 >/dev/null 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/health/ready >/dev/null; then
              echo "✅ Backend /health/ready OK"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend /health/ready failed after rollout"
          exit 1

      - name: Smoke test frontend (/)
        if: steps.cluster.outputs.configured == 'true'
        run: |
          kubectl port-forward svc/finchippay-frontend -n finchippay 3000:3000 >/dev/null 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then
              echo "✅ Frontend / OK"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Frontend / failed after rollout"
          exit 1

      # ─── Automatic rollback if any deploy or smoke step failed ───────────
      - name: Rollback on failure
        if: failure()
        run: |
          echo "::warning::Rolling back to the previous revision"
          kubectl rollout undo deployment/finchippay-backend -n finchippay || true
          kubectl rollout undo deployment/finchippay-frontend -n finchippay || true
          kubectl rollout undo deployment/finchippay-nginx -n finchippay || true
          kubectl rollout status deployment/finchippay-backend -n finchippay --timeout=3m || true

      - name: Post deployment summary
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
        with:
          script: |
            const status = process.env.DEPLOY_STATUS === 'success' ? '✅ Success' : '❌ Failed';
            const sha = process.env.SHA.substring(0, 7);
            const env = process.env.ENVIRONMENT;
            const workflowUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const body = [
              `## 🚀 Kubernetes Deploy — ${status}`,
              '',
              `| Field | Value |`,
              `|-------|-------|`,
              `| **Environment** | \`${env}\` |`,
              `| **Commit** | [\`${sha}\`](${workflowUrl}) |`,
              `| **Registry** | \`${process.env.REGISTRY}\` |`,
              '',
              `> Deployed via [kubernetes-deploy workflow](${workflowUrl}).`,
            ].join('\n');

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            if (prs.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs[0].number,
                body,
              });
              core.notice(`Posted deployment comment on PR #${prs[0].number}`);
            }

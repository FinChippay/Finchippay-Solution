name: SDK Drift Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sdk-drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root & SDK dependencies
        run: npm ci

      - name: Build SDK (compile TypeScript)
        run: npm run build --workspace=sdk

      - name: Install backend dependencies (needed for swagger-jsdoc)
        working-directory: backend
        run: npm ci

      - name: Check generated SDK types match OpenAPI spec
        run: npm run check:sdk

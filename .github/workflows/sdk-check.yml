name: SDK Drift Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root & SDK dependencies
        run: npm ci --ignore-scripts

      - name: Build SDK (compile TypeScript)
        run: npm run build --workspace=sdk

      - name: Install backend dependencies
        working-directory: backend
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3
          npm ci

      - name: Run database migrations
        working-directory: backend
        run: npm run migrate
        env:
          NODE_ENV: test
          DB_PROVIDER: sqlite

      - name: Start backend for SDK drift check
        working-directory: backend
        run: |
          mkdir -p data
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && echo "Backend ready" && break
            [ "$i" -eq 30 ] && echo "Backend failed to start" && exit 1
            sleep 1
          done
        env:
          PORT: 4000
          NODE_ENV: test
          DB_PROVIDER: sqlite
          STELLAR_NETWORK: testnet
          HORIZON_URL: https://horizon-testnet.stellar.org
          JWT_SECRET: test-secret-for-sdk-check
          # Backend env validation rejects "*" — it expects scheme://host[:port]
          # entries with no wildcards. The drift check only talks to the API over
          # localhost, so the local frontend origin is all that needs to pass.
          ALLOWED_ORIGINS: "http://localhost:3000"
          # Required at startup to provision the SEP-24 callback webhook secret
          # (inboundWebhookSecretService), even outside production.
          WEBHOOK_ENCRYPTION_KEY: "aaabbbcccdddeeefff000111222333444555666777888999000aaabbbcccdddee"

      - name: Check generated SDK types
        run: npm run check:sdk
        env:
          API_URL: http://localhost:4000

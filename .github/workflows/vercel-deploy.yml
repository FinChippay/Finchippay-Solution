# .github/workflows/vercel-deploy.yml
# Deploy frontend to Vercel on push to main and PR previews.
#
# Setup:
#   1. Install Vercel CLI: npm i -g vercel
#   2. Link project: vercel link
#   3. Add secrets to GitHub:
#      - VERCEL_TOKEN           (from https://vercel.com/account/tokens)
#      - VERCEL_ORG_ID          (from .vercel/project.json)
#      - VERCEL_PROJECT_ID      (from .vercel/project.json)
#      - NEXT_PUBLIC_SENTRY_DSN (optional, enables Sentry error reporting)
#
# This workflow deploys:
#   - Production on push to main (with health-gated promotion)
#   - Preview on pull requests (comment with preview URL)

name: Vercel Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.19.5'

jobs:
  # ─── Preview Deploy (on PR) ────────────────────────────────────────────────
  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: "preview"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build SDK (workspace dependency)
        run: npm run build:sdk

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: frontend
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        working-directory: frontend
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || '' }}

      - name: Deploy Preview to Vercel
        id: deploy
        working-directory: frontend
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment PR with Preview URL
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## 🚀 Vercel Preview Deployed

            **Preview URL:** ${{ steps.deploy.outputs.preview_url }}

            > This preview will update automatically on new commits.
          comment-tag: vercel-preview

  # ─── Production Deploy (on push to main) ────────────────────────────────────
  deploy-production:
    name: Deploy Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: "production"
      url: https://finchippay.vercel.app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build SDK (workspace dependency)
        run: npm run build:sdk

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        working-directory: frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || '' }}

      - name: Deploy staging build
        id: staging-deploy
        working-directory: frontend
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "staging_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify health endpoint on staging deployment
        id: health-check
        run: |
          STAGING_URL="${{ steps.staging-deploy.outputs.staging_url }}"
          echo "Checking health at ${STAGING_URL}/api/health ..."
          HEALTH_OK=false
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}/api/health")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
              HEALTH_OK=true
              break
            fi
            echo "Attempt $i/12: HTTP $HTTP_CODE — retrying in 5s..."
            sleep 5
          done
          echo "health_ok=$HEALTH_OK" >> "$GITHUB_OUTPUT"
          if [ "$HEALTH_OK" != "true" ]; then
            echo "❌ Health check failed after 12 attempts"
            echo "::warning::Staging deployment is live but was NOT promoted. Previous production deployment is still active."
            exit 1
          fi

      - name: Promote staging to production
        if: steps.health-check.outputs.health_ok == 'true'
        working-directory: frontend
        run: |
          vercel promote ${{ steps.staging-deploy.outputs.staging_url }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Send deployment notification
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const body = status === 'success'
              ? '✅ Deployment completed successfully and was promoted to production.'
              : '❌ Deployment failed or was rolled back after the health check gate.';

            // Only post if there's an associated PR
            if (context.payload && context.payload.pull_request) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Update GitHub Deployment Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment: 'production',
              required_contexts: [],
              description: 'Vercel blue-green deployment processed'
            });
            const jobStatus = '${{ job.status }}';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: jobStatus === 'success' ? 'success' : 'failure',
              environment_url: 'https://finchippay.vercel.app',
              description: jobStatus === 'success' ? 'Blue-green promotion completed' : 'Blue-green deployment failed or rolled back'
            });

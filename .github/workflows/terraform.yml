# .github/workflows/terraform.yml
# Terraform Infrastructure as Code — AWS ECS Fargate
#
# Plan:  runs on every pull request targeting main (posts plan as a PR comment).
# Apply: runs on push to main with a manual approval gate via GitHub Environments.
#
# Required GitHub Secrets:
#   AWS_ROLE_ARN              — IAM role to assume via OIDC (configure-aws-credentials)
#   TF_STATE_BUCKET           — S3 bucket holding Terraform state
#   TF_STATE_LOCK_TABLE       — DynamoDB table used for state locking
#
# Optional GitHub Secrets (overrides):
#   TF_VAR_allowed_origins    — CORS origins for the deployed app

name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (dev, staging, or prod)"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: "Terraform action to perform"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_VERSION: "1.6.6"
  TF_WORKING_DIR: terraform
  AWS_REGION: us-east-1

jobs:
  # ─── Terraform Plan (on PR) ───────────────────────────────────────────────
  plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      # Plan needs AWS OIDC credentials to reach remote state; skip with a
      # notice when the secrets are not configured.
      - name: Check AWS credentials configured
        id: aws
        run: |
          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=AWS Not Configured::AWS_ROLE_ARN secret is not set, so Terraform plan is skipped."
          fi

      - name: Setup Terraform
        if: steps.aws.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        if: steps.aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        if: steps.aws.outputs.configured == 'true'
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init (remote state)
        if: steps.aws.outputs.configured == 'true'
        id: init
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=finchippay/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        if: steps.aws.outputs.configured == 'true'
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        if: steps.aws.outputs.configured == 'true'
        id: plan
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -var="environment=dev" \
            -var-file="environments/dev/dev.tfvars" \
            -out=tfplan \
            | tee /tmp/plan.txt
        env:
          TF_VAR_allowed_origins: ${{ secrets.TF_VAR_allowed_origins || '' }}
        continue-on-error: true

      - name: Post Plan to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.existsSync('/tmp/plan.txt')
              ? fs.readFileSync('/tmp/plan.txt', 'utf8')
              : 'Plan output not available.';

            const summary = planOutput.length > 50000
              ? planOutput.substring(0, 50000) + '\n\n... (truncated)'
              : planOutput;

            const body = `## 🏗️ Terraform Plan

            <details><summary>Show plan output</summary>

            \`\`\`terraform
            ${summary}
            \`\`\`

            </details>

            > **Action:** Review the plan above. Merge to \`main\` to trigger \`terraform apply\`.
            > **Format:** ${{ steps.fmt.outcome }}
            > **Init:** ${{ steps.init.outcome }}
            > **Validate:** ${{ steps.validate.outcome }}
            > **Plan:** ${{ steps.plan.outcome }}
            `;

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            if (prs.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs[0].number,
                body,
              });
            }

      - name: Upload Plan Artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 7

  # ─── Terraform Apply (on push to main, prod requires approval) ───────────
  apply:
    name: Terraform Apply (prod)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      # Apply can't run without AWS OIDC credentials; when the secrets are
      # not configured the job skips with a notice instead of failing red.
      - name: Check AWS credentials configured
        id: aws
        run: |
          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "AWS_ROLE_ARN is set — proceeding with apply"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=AWS Not Configured::AWS_ROLE_ARN secret is not set, so Terraform apply is skipped. Add the secret (and OIDC trust) to enable infra deploys."
          fi

      - name: Setup Terraform
        if: steps.aws.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        if: steps.aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init (remote state)
        if: steps.aws.outputs.configured == 'true'
        id: init
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=finchippay/prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Plan (for apply)
        if: steps.aws.outputs.configured == 'true'
        id: plan
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -var-file="environments/prod/prod.tfvars" \
            -out=tfplan
        env:
          TF_VAR_allowed_origins: ${{ secrets.TF_VAR_allowed_origins || '' }}

      - name: Terraform Apply
        if: steps.aws.outputs.configured == 'true'
        id: apply
        run: terraform apply -input=false -auto-approve tfplan
        env:
          TF_VAR_allowed_origins: ${{ secrets.TF_VAR_allowed_origins || '' }}

      - name: Terraform Output
        if: steps.aws.outputs.configured == 'true'
        id: output
        run: terraform output -json | tee terraform-outputs.json

      - name: Upload Terraform Outputs
        if: steps.aws.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}/terraform-outputs.json
          retention-days: 90

  # ─── Workflow Dispatch (manual) ───────────────────────────────────────────
  manual:
    name: Manual Terraform (${{ github.event.inputs.action }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Check AWS credentials configured
        id: aws
        run: |
          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=AWS Not Configured::AWS_ROLE_ARN secret is not set, so the manual Terraform ${{ github.event.inputs.action }} is skipped."
          fi

      - name: Setup Terraform
        if: steps.aws.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        if: steps.aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-manual
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init (remote state)
        if: steps.aws.outputs.configured == 'true'
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=finchippay/${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        if: steps.aws.outputs.configured == 'true' && github.event.inputs.action == 'plan'
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -var-file="environments/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfvars"

      - name: Terraform Apply
        if: steps.aws.outputs.configured == 'true' && github.event.inputs.action == 'apply'
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -var-file="environments/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfvars" \
            -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      - name: Terraform Destroy
        if: steps.aws.outputs.configured == 'true' && github.event.inputs.action == 'destroy'
        run: |
          terraform plan -destroy \
            -no-color \
            -input=false \
            -var-file="environments/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfvars" \
            -out=tfdestroy
          terraform apply -input=false -auto-approve tfdestroy

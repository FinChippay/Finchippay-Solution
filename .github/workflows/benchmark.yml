name: Benchmark

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run backend perf tests
        working-directory: backend
        run: npx jest --runInBand --testPathPattern=perf --json --outputFile=/tmp/backend-perf.json
        env:
          NODE_ENV: test

      - name: Run frontend perf tests
        working-directory: frontend
        run: npx jest --runInBand --testPathPattern=perf --json --outputFile=/tmp/frontend-perf.json

      - name: Build benchmark snapshot
        run: |
          node <<'EOF'
          const fs = require('fs');
          const suites = [];
          for (const [name, file] of [
            ['backend.api-bench', '/tmp/backend-perf.json'],
            ['frontend.render-bench', '/tmp/frontend-perf.json'],
          ]) {
            if (!fs.existsSync(file)) continue;
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!report.testResults) continue;
            let total = 0;
            for (const tr of report.testResults) {
              for (const a of tr.assertionResults || []) total += a.duration || 0;
            }
            suites.push({ name, value: Math.max(1, Math.round(total)) });
          }
          fs.mkdirSync('benchmarks', { recursive: true });
          fs.writeFileSync('benchmarks/current.json', JSON.stringify(suites, null, 2));
          console.log('Benchmark snapshot:', JSON.stringify(suites));
          EOF

      - name: Compare against baseline
        run: |
          if [ -f benchmarks/base.json ]; then
            node scripts/compare-benchmarks.js benchmarks/base.json benchmarks/current.json benchmarks/summary.md 50
          else
            echo "No baseline found — storing current snapshot as the new baseline."
            cp benchmarks/current.json benchmarks/base.json
            echo "No regressions detected (first baseline)." > benchmarks/summary.md
          fi
          cat benchmarks/summary.md

      - name: Upload benchmark summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: benchmarks/summary.md
          retention-days: 30

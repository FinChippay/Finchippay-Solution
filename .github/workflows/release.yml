# Automatically creates a GitHub Release when a version tag (v*.*.*) is pushed.
# Generates release notes from conventional commits since the previous tag.
# Generates CycloneDX and SPDX SBOMs for all components and attaches them
# as release assets so consumers can verify the supply chain.
#
# Supply-chain controls (issue #644):
# - SBOM files are signed with cosign (keyless, OIDC) and both signature and
#   certificate are attached to the release.
# - SLSA v1.0 provenance is generated for the release assets via the official
#   slsa-github-generator reusable workflow and attached to the release.
#
# Requires: no manual steps — push a tag to trigger:
#   git tag v1.2.3 && git push origin v1.2.3

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  discussions: write
  security-events: write
  id-token: write # required for keyless cosign signing and SLSA provenance

jobs:
  # ─── Generate SBOMs ─────────────────────────────────────────────────────────
  sbom:
    name: Generate Release SBOMs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate frontend SBOM (CycloneDX)
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ./frontend
          artifact-name: sbom-frontend-cdx.json
          output-file: sbom/frontend.cdx.json
          format: cyclonedx-json

      - name: Generate frontend SBOM (SPDX)
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ./frontend
          artifact-name: sbom-frontend-spdx.json
          output-file: sbom/frontend.spdx.json
          format: spdx-json

      - name: Generate backend SBOM (CycloneDX)
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ./backend
          artifact-name: sbom-backend-cdx.json
          output-file: sbom/backend.cdx.json
          format: cyclonedx-json

      - name: Generate backend SBOM (SPDX)
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ./backend
          artifact-name: sbom-backend-spdx.json
          output-file: sbom/backend.spdx.json
          format: spdx-json

      - name: Generate contracts SBOM (CycloneDX)
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ./contracts/finchippay-contract
          artifact-name: sbom-contract-cdx.json
          output-file: sbom/contract.cdx.json
          format: cyclonedx-json

      - name: Generate contracts SBOM (SPDX)
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ./contracts/finchippay-contract
          artifact-name: sbom-contract-spdx.json
          output-file: sbom/contract.spdx.json
          format: spdx-json

      - name: Upload SBOM bundle (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-release-${{ github.ref_name }}
          path: sbom/
          retention-days: 365

  # ─── Create GitHub Release ───────────────────────────────────────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: sbom
    outputs:
      digests: ${{ steps.subjects.outputs.digests }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.18.1

      - name: Generate SBOMs (SPDX + CycloneDX)
        run: |
          mkdir -p sbom
          syft dir:frontend                      -o spdx-json=sbom/frontend.spdx.json -o cyclonedx-json=sbom/frontend.cdx.json
          syft dir:backend                       -o spdx-json=sbom/backend.spdx.json  -o cyclonedx-json=sbom/backend.cdx.json
          syft dir:contracts/finchippay-contract -o spdx-json=sbom/contract.spdx.json -o cyclonedx-json=sbom/contract.cdx.json

      - name: Prepare SBOM release note
        run: |
          {
            echo ""
            echo "## Software Bill of Materials (SBOM)"
            echo ""
            echo "SPDX and CycloneDX SBOMs for the frontend, backend, and Soroban"
            echo "contract are attached to this release as assets. Each SBOM is"
            echo "also signed with cosign (keyless) — see the \`.sig\`/\`.pem\`"
            echo "companion assets and"
            echo "\`docs/supply-chain-verification.md\` for verification steps."
            echo ""
            echo "- \`frontend.spdx.json\` / \`frontend.cdx.json\`"
            echo "- \`backend.spdx.json\` / \`backend.cdx.json\`"
            echo "- \`contract.spdx.json\` / \`contract.cdx.json\`"
          } > sbom-notes.md

      # ── Sign SBOM release assets with cosign (keyless, OIDC) ──────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.1"

      - name: Sign SBOM release assets with cosign
        run: |
          for f in sbom/*.json; do
            cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
          done

      # ── Compute SLSA subject digests for the attached release assets ───────
      # The generator expects the same format as `sha256sum` output
      # (`<hex>  <filename>` per line), base64-encoded.
      - name: Compute SLSA subject digests
        id: subjects
        run: |
          cd sbom
          sha256sum *.json > subjects.txt
          DIGESTS=$(base64 -w0 subjects.txt)
          echo "digests=$DIGESTS" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          append_body: true
          body_path: sbom-notes.md
          files: |
            sbom/*.json
            sbom/*.sig
            sbom/*.pem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── SLSA Provenance ──────────────────────────────────────────────────────
  slsa-provenance:
    name: Generate SLSA Provenance
    needs: create-release
    permissions:
      contents: write
      id-token: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.create-release.outputs.digests }}"
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}

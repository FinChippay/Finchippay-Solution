# .github/workflows/sbom-scan.yml
# Scheduled weekly SBOM generation + supply-chain vulnerability scan.
# Generates SPDX + CycloneDX SBOMs for all components, uploads them as
# artifacts, scans with Grype, and opens a tracking issue when new CRITICAL
# vulnerabilities are found.

name: Weekly SBOM Scan

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8 AM UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  sbom-scan:
    name: Generate SBOMs & Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.18.1

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin v0.87.0

      - name: Generate SBOMs (SPDX + CycloneDX)
        run: |
          mkdir -p sbom
          syft dir:frontend                      -o spdx-json=sbom/frontend.spdx.json -o cyclonedx-json=sbom/frontend.cdx.json
          syft dir:backend                       -o spdx-json=sbom/backend.spdx.json  -o cyclonedx-json=sbom/backend.cdx.json
          syft dir:contracts/finchippay-contract -o spdx-json=sbom/contract.spdx.json -o cyclonedx-json=sbom/contract.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: sbom/
          retention-days: 90

      - name: Scan SBOMs (collect results)
        id: scan
        run: |
          mkdir -p scan
          FOUND_CRITICAL=0
          FOUND_HIGH=0
          for component in frontend backend contract; do
            grype "sbom:sbom/${component}.cdx.json" -o json > "scan/${component}.json" || true
            CRIT=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' "scan/${component}.json")
            HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' "scan/${component}.json")
            echo "$component: $CRIT critical, $HIGH high"
            if [ "$CRIT" -gt 0 ]; then FOUND_CRITICAL=1; fi
            if [ "$HIGH" -gt 0 ]; then FOUND_HIGH=1; fi
          done
          echo "found_critical=$FOUND_CRITICAL" >> "$GITHUB_OUTPUT"
          if [ "$FOUND_HIGH" -eq 1 ]; then
            echo "::warning::HIGH-severity vulnerabilities detected — review the scan results."
          fi

      - name: Build critical-vulnerability report
        if: steps.scan.outputs.found_critical == '1'
        run: |
          {
            echo "Automated weekly SBOM scan detected **CRITICAL** vulnerabilities."
            echo ""
            for component in frontend backend contract; do
              echo "### $component"
              echo ""
              jq -r '.matches[]
                | select(.vulnerability.severity == "Critical")
                | "- **\(.vulnerability.id)** in `\(.artifact.name)@\(.artifact.version)` — \(.vulnerability.description // "no description" | .[0:160])"' \
                "scan/${component}.json" | sort -u
              echo ""
            done
            echo "_Generated by \`.github/workflows/sbom-scan.yml\` on $(date -u +%Y-%m-%d)._"
          } > critical-report.md
          cat critical-report.md

      - name: Open / update tracking issue
        if: steps.scan.outputs.found_critical == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Security: CRITICAL vulnerabilities detected by weekly SBOM scan"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file critical-report.md
          else
            echo "Creating new tracking issue"
            # Ensure the label exists (no-op if it already does), then create the issue.
            gh label create security --color d73a4a --description "Security-related" 2>/dev/null || true
            gh issue create --title "$TITLE" --body-file critical-report.md --label security
          fi

      - name: Fail if critical vulnerabilities found
        if: steps.scan.outputs.found_critical == '1'
        run: |
          echo "CRITICAL vulnerabilities detected — failing the scan."
          exit 1

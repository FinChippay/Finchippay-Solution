on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  contract-bindings:
    name: Contract Bindings
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32v1-none
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-bindings-${{ hashFiles('contracts/finchippay-contract/Cargo.lock') }}
      - run: cargo install --locked stellar-cli

      - name: Generate bindings
        id: generate
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.TESTNET_CONTRACT_ID }}" ]; then
            bash ../scripts/gen-contract-bindings.sh
          else
            echo "::notice::Skipping - TESTNET_CONTRACT_ID not set."
          fi
        env:
          CONTRACT_ID: ${{ secrets.TESTNET_CONTRACT_ID }}

      - name: Check drift
        if: ${{ steps.generate.outcome == 'success' && secrets.TESTNET_CONTRACT_ID != '' }}
        run: |
          git diff --exit-code frontend/lib/contract-bindings/ \
            || (echo "ERROR: Generated contract bindings differ. Run scripts/gen-contract-bindings.sh and commit." && exit 1)

name: Canary Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target (frontend, backend, both)"
        required: true
        default: "both"
      canary_weight_start:
        description: "Initial traffic percentage (backend)"
        required: false
        default: "10"
      canary_weight_step:
        description: "Intermediate traffic percentage (backend)"
        required: false
        default: "50"
      monitor_duration_minutes:
        description: "Monitor duration in minutes per stage"
        required: false
        default: "5"
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # OIDC role assumption — no long-lived AWS access keys (matches terraform.yml).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: finchippay-canary
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy Canary
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
          ALB_LISTENER_ARN: ${{ secrets.ALB_LISTENER_ARN }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          CANARY_WEIGHT_START: ${{ github.event.inputs.canary_weight_start || '10' }}
          CANARY_WEIGHT_STEP: ${{ github.event.inputs.canary_weight_step || '50' }}
          CANARY_WEIGHT_FINAL: "100"
          MONITOR_DURATION_MINUTES: ${{ github.event.inputs.monitor_duration_minutes || '5' }}
          HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}
        run: |
          chmod +x scripts/canary-deploy.sh
          ./scripts/canary-deploy.sh ${{ github.event.inputs.target || 'both' }}

      - name: Post result as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}';
            const pr = context.payload.pull_request;
            if (pr) {
              await github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `Canary deployment finished with status: ${result}`
              });
            }

# .github/workflows/terraform-deploy.yml
# Terraform Infrastructure as Code — Plan & Apply for DigitalOcean
#
# Plan:  runs on every pull request targeting main (shows diff in PR comment).
# Apply: runs on push to main with a manual approval gate via GitHub Environments.
#
# Required GitHub Secrets:
#   DIGITALOCEAN_TOKEN      — DigitalOcean personal access token
#   DIGITALOCEAN_SPACES_KEY — Spaces access key (for remote state backend)
#   DIGITALOCEAN_SPACES_SECRET — Spaces secret key (for remote state backend)
#
# Optional GitHub Secrets:
#   SSH_PUBLIC_KEY          — SSH public key content for Droplet access
#   TF_VAR_db_password      — Override auto-generated DB password
#   TF_VAR_redis_password   — Override auto-generated Redis password

name: Terraform Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-deploy.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (staging or production)"
        required: true
        type: choice
        options:
          - staging
          - production
      action:
        description: "Terraform action to perform"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_VERSION: "1.6.6"
  TF_WORKING_DIR: terraform
  AWS_REGION: us-east-1

jobs:
  # ─── Terraform Plan (on PR) ───────────────────────────────────────────────
  plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DIGITALOCEAN_SPACES_KEY || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DIGITALOCEAN_SPACES_SECRET || '' }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -var="environment=staging" \
            -out=tfplan \
            | tee /tmp/plan.txt
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DIGITALOCEAN_SPACES_KEY || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DIGITALOCEAN_SPACES_SECRET || '' }}
          TF_VAR_do_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password || '' }}
          TF_VAR_redis_password: ${{ secrets.TF_VAR_redis_password || '' }}
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.existsSync('/tmp/plan.txt')
              ? fs.readFileSync('/tmp/plan.txt', 'utf8')
              : 'Plan output not available.';

            const summary = planOutput.length > 50000
              ? planOutput.substring(0, 50000) + '\n\n... (truncated)'
              : planOutput;

            const body = `## 🏗️ Terraform Plan

            <details><summary>Show plan output</summary>

            \`\`\`terraform
            ${summary}
            \`\`\`

            </details>

            > **Action:** Review the plan above. Merge to \`main\` to trigger \`terraform apply\`.
            > **Format:** ${{ steps.fmt.outcome }}
            > **Validate:** ${{ steps.validate.outcome }}
            `;

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            if (prs.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs[0].number,
                body,
              });
            }

      - name: Upload Plan Artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 7

  # ─── Terraform Apply (on push to main) ────────────────────────────────────
  apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DIGITALOCEAN_SPACES_KEY || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DIGITALOCEAN_SPACES_SECRET || '' }}

      - name: Terraform Plan (for apply)
        id: plan
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -var="environment=production" \
            -out=tfplan
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          TF_VAR_do_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password || '' }}
          TF_VAR_redis_password: ${{ secrets.TF_VAR_redis_password || '' }}

      - name: Terraform Apply
        id: apply
        run: terraform apply -input=false -auto-approve tfplan
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          TF_VAR_do_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password || '' }}
          TF_VAR_redis_password: ${{ secrets.TF_VAR_redis_password || '' }}

      - name: Terraform Output
        id: output
        run: terraform output -json | tee terraform-outputs.json

      - name: Upload Terraform Outputs
        uses: actions/upload-artifact@v7
        with:
          name: terraform-outputs-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}/terraform-outputs.json
          retention-days: 90

      - name: Post Apply Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅ Success' : '❌ Failed';
            const sha = context.sha.substring(0, 7);
            const workflowUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const body = [
              `## 🏗️ Terraform Apply — ${status}`,
              '',
              `Infrastructure changes applied on commit [\`${sha}\`](${workflowUrl}).`,
              '',
              '| Step | Status |',
              '|------|--------|',
              `| Init | ${{ steps.init.outcome }} |`,
              `| Plan | ${{ steps.plan.outcome }} |`,
              `| Apply | ${{ steps.apply.outcome }} |`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number || 1,
              body,
            }).catch(() => {});

  # ─── Workflow Dispatch (manual) ───────────────────────────────────────────
  manual:
    name: Manual Terraform (${{ github.event.inputs.action }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DIGITALOCEAN_SPACES_KEY || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DIGITALOCEAN_SPACES_SECRET || '' }}

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -var="environment=${{ github.event.inputs.environment }}"
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          TF_VAR_do_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password || '' }}
          TF_VAR_redis_password: ${{ secrets.TF_VAR_redis_password || '' }}

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -var="environment=${{ github.event.inputs.environment }}" \
            -out=tfplan
          terraform apply -input=false -auto-approve tfplan
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          TF_VAR_do_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password || '' }}
          TF_VAR_redis_password: ${{ secrets.TF_VAR_redis_password || '' }}

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          terraform plan -destroy \
            -no-color \
            -input=false \
            -var="environment=${{ github.event.inputs.environment }}" \
            -out=tfdestroy
          terraform apply -input=false -auto-approve tfdestroy
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          TF_VAR_do_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password || '' }}
          TF_VAR_redis_password: ${{ secrets.TF_VAR_redis_password || '' }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: finchippay-frontend
  labels:
    app: finchippay-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finchippay-frontend
  template:
    metadata:
      labels:
        app: finchippay-frontend
    spec:
      containers:
        - name: frontend
          image: finchippay/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_STELLAR_NETWORK
              value: testnet
            - name: NEXT_PUBLIC_HORIZON_URL
              value: https://horizon-testnet.stellar.org
            - name: NEXT_PUBLIC_API_URL
              value: http://finchippay-backend:4000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: finchippay-nginx
  labels:
    app: finchippay-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finchippay-nginx
  template:
    metadata:
      labels:
        app: finchippay-nginx
    spec:
      containers:
        - name: nginx
          image: finchippay/nginx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

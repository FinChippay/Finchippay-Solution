# ─── Global settings ───────────────────────────────────────────────────────────
environment: production

# ─── Frontend Service ──────────────────────────────────────────────────────────
frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/finchippay/finchippay-frontend
    tag: latest
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ─── Backend Service ───────────────────────────────────────────────────────────
backend:
  replicaCount: 1
  image:
    repository: ghcr.io/finchippay/finchippay-backend
    tag: latest
  service:
    type: ClusterIP
    port: 4000
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ─── Nginx Reverse Proxy ───────────────────────────────────────────────────────
nginx:
  replicaCount: 1
  image:
    repository: ghcr.io/finchippay/finchippay-nginx
    tag: latest
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
